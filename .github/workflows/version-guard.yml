name: Version Guard

# PR-side guard: version bump must be strictly greater than the last tag and
# backed by a CHANGELOG entry. Runs on every PR; no-ops when VERSION unchanged.
#
# Hardening: every action is pinned to an immutable commit SHA (tag in a trailing
# comment), not a movable @vN tag.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  version-guard:
    name: version-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect version file change
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -qx 'VERSION'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No version change — pass
        if: steps.changed.outputs.changed != 'true'
        run: echo "VERSION unchanged; version guard passes trivially."

      - name: Set up cached CI tools
        if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/setup-ci-tools

      - name: Run version guard
        id: guard
        if: steps.changed.outputs.changed == 'true'
        run: |
          set +e
          python3 release/_lib/version_check.py --strict --markdown guard.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Post guard result
        if: steps.changed.outputs.changed == 'true' && always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('guard.md')) return;
            const body = fs.readFileSync('guard.md', 'utf8');
            const marker = '<!-- version-guard -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
            }

      - name: Fail on violation
        if: steps.guard.outputs.rc != '' && steps.guard.outputs.rc != '0'
        run: |
          echo "::error::Version guard found bump issues — see the PR comment."
          exit 1
