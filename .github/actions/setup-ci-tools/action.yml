name: Setup CI tools
description: Cache and install shared Python tooling for release workflows.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"
  python-packages:
    description: Space-separated pip packages to install into the cached virtualenv.
    required: false
    default: "pyyaml"

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache Python virtualenv
      if: inputs.python-version != '' && inputs.python-packages != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .venv/ci
        key: ${{ runner.os }}-py${{ inputs.python-version }}-venv-${{ hashFiles('.github/actions/setup-ci-tools/action.yml', '.github/workflows/*.yml') }}

    - name: Install Python packages
      if: inputs.python-version != '' && inputs.python-packages != ''
      shell: bash
      run: |
        set -euo pipefail
        python -m venv .venv/ci
        source .venv/ci/bin/activate
        marker=".venv/ci/.deps-$(printf '%s' '${{ inputs.python-packages }}' | sha256sum | cut -d' ' -f1)"
        if [ ! -f "$marker" ]; then
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --quiet ${{ inputs.python-packages }}
          touch "$marker"
        fi
        echo "$PWD/.venv/ci/bin" >> "$GITHUB_PATH"
