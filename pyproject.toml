[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "melampus-platform"
dynamic = ["version"]
description = "Local intent tracing and contract evidence for Melampus codebases."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Melampus contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = [
  "melampus @ https://github.com/melampus-org/melampus-python/releases/download/v0.2.0/melampus-0.2.0-py3-none-any.whl",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2"
]

[project.scripts]
melampus-platform = "melampus_platform.cli:main"

[project.urls]
Homepage = "https://github.com/melampus-org/melampus-platform"
Issues = "https://github.com/melampus-org/melampus-platform/issues"

[dependency-groups]
dev = ["hatchling>=1.27,<2", "pytest>=8,<10", "pytest-cov>=7,<8", "ruff>=0.12,<1", "mypy>=1.15,<2", "twine>=6.1,<8", "httpx>=0.28,<1", "pyyaml>=6,<7"]

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\d+\.\d+\.\d+)$'
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/melampus_platform"]
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "scripts", "release", "Makefile", "pyproject.toml", "uv.lock", "VERSION", "README.md", "LICENSE", "CHANGELOG.md", "DESIGN.md", "PRODUCT.md"]
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["release/_lib"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.11"
strict = true
[[tool.mypy.overrides]]
module = ["opentelemetry.proto.*", "google.protobuf.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]
